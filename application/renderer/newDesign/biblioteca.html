<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StormStore | Biblioteca</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        store: {
                            bg: '#1e1e1e',
                            sidebar: '#202020',
                            card: '#272727',
                            hover: '#323232',
                            active: '#2b2b2b',
                            border: '#333333',
                            yellow: '#ffd800',
                            yellowHover: '#f5cd00',
                            inputBg: '#2d2d2d',
                            inputBorder: '#3f3f3f'
                        }
                    },
                    fontFamily: {
                        sans: ['Segoe UI', Tahoma, Geneva, Verdana, sans-serif]
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Windows/Store Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/biblioteca.css">
</head>
<body class="bg-[#191919] text-white h-screen overflow-hidden flex flex-col font-sans select-none">

    <!-- Top Windows Titlebar Simulation -->
    <header class="h-10 bg-[#1f1f1f] flex items-center justify-between px-3 shrink-0 border-b border-[#2d2d2d]">
        <div class="flex items-center space-x-2">
            <span class="text-xs text-gray-300 font-medium flex items-center gap-2">
                <img src="../../assets/app.ico" class="w-4 h-4" />
                StormStore
            </span>
        </div>

        <!-- Search Bar -->
        <div class="flex-1 max-w-xl mx-8">
            <div class="relative flex items-center">
                <input type="text" placeholder="Buscar aplicaciones, juegos y mucho más" 
                    class="w-full bg-[#2c2c2c] border border-[#3c3c3c] rounded-md py-1.5 pl-4 pr-10 text-xs text-gray-200 placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:bg-[#202020] transition-colors">
                <i class="fa-solid fa-magnifying-glass absolute right-3 text-gray-400 text-xs"></i>
            </div>
        </div>

        <!-- Window Controls & User Profile -->
        <div class="flex items-center space-x-3">
            <button class="w-7 h-7 flex items-center justify-center rounded hover:bg-[#333] text-gray-300 text-xs transition-colors">
                <i class="fa-regular fa-user"></i>
            </button>
            <div class="flex items-center space-x-1 pl-2 border-l border-[#333] text-gray-400">
                <button class="w-8 h-7 flex items-center justify-center hover:bg-[#333] hover:text-white"><i class="fa-solid fa-minus text-[10px]"></i></button>
                <button class="w-8 h-7 flex items-center justify-center hover:bg-[#333] hover:text-white"><i class="fa-regular fa-square text-[10px]"></i></button>
                <button class="w-8 h-7 flex items-center justify-center hover:bg-red-600 hover:text-white"><i class="fa-solid fa-xmark text-xs"></i></button>
            </div>
        </div>
    </header>

    <!-- Main Workspace Layout -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-16 bg-[#1f1f1f] flex flex-col items-center py-3 shrink-0 justify-between border-r border-[#2d2d2d]">
            <div class="flex flex-col items-center space-y-1 w-full">
                <!-- Nav Item: Inicio -->
                <a href="index.html" data-page-link="index" class="nav-link group relative w-12 h-12 flex flex-col items-center justify-center rounded-lg hover:bg-[#2b2b2b] text-gray-400 hover:text-white transition-all">
                    <div class="nav-indicator absolute left-0 top-3 bottom-3 w-1 bg-amber-400 rounded-r"></div>
                    <i class="fa-solid fa-house text-sm"></i>
                    <span class="text-[9px] mt-1">Inicio</span>
                </a>
                <!-- Nav Item: Aplicaciones -->
                <a href="aplicaciones.html" data-page-link="aplicaciones" class="nav-link group relative w-12 h-12 flex flex-col items-center justify-center rounded-lg hover:bg-[#2b2b2b] text-gray-400 hover:text-white transition-all">
                    <div class="nav-indicator absolute left-0 top-3 bottom-3 w-1 bg-amber-400 rounded-r"></div>
                    <i class="fa-solid fa-window-maximize text-sm"></i>
                    <span class="text-[9px] mt-1">Aplicaciones</span>
                </a>
                <!-- Nav Item: Juegos -->
                <a href="juegos.html" data-page-link="juegos" class="nav-link group relative w-12 h-12 flex flex-col items-center justify-center rounded-lg hover:bg-[#2b2b2b] text-gray-400 hover:text-white transition-all">
                    <div class="nav-indicator absolute left-0 top-3 bottom-3 w-1 bg-amber-400 rounded-r"></div>
                    <i class="fa-solid fa-gamepad text-sm"></i>
                    <span class="text-[9px] mt-1">Juegos</span>
                </a>
                <!-- Nav Item: Temas -->
                <a href="temas.html" data-page-link="temas" class="nav-link group relative w-12 h-12 flex flex-col items-center justify-center rounded-lg hover:bg-[#2b2b2b] text-gray-400 hover:text-white transition-all">
                    <div class="nav-indicator absolute left-0 top-3 bottom-3 w-1 bg-amber-400 rounded-r"></div>
                    <i class="fa-solid fa-paintbrush text-sm"></i>
                    <span class="text-[9px] mt-1">Temas</span>
                </a>
            </div>

            <!-- Bottom Sidebar Nav -->
            <div class="flex flex-col items-center space-y-1 w-full">
                <!-- Nav Item: Novedades -->
                <a href="novedades.html" data-page-link="novedades" class="nav-link group relative w-12 h-12 flex flex-col items-center justify-center rounded-lg hover:bg-[#2b2b2b] text-gray-400 hover:text-white transition-all">
                    <div class="nav-indicator absolute left-0 top-3 bottom-3 w-1 bg-amber-400 rounded-r"></div>
                    <i class="fa-solid fa-bullhorn text-sm"></i>
                    <span class="text-[9px] mt-1">Novedades</span>
                </a>
                <!-- Nav Item: Biblioteca (Active) -->
                <a href="biblioteca.html" data-page-link="biblioteca" aria-current="page" class="nav-link group relative w-12 h-12 flex flex-col items-center justify-center rounded-lg hover:bg-[#2b2b2b] text-gray-400 hover:text-white transition-all">
                    <div class="nav-indicator absolute left-0 top-3 bottom-3 w-1 bg-amber-400 rounded-r"></div>
                    <i class="fa-solid fa-download text-sm"></i>
                </a>
            </div>
        </aside>

        <!-- Main Content Scroll Area -->
        <main class="flex-1 overflow-y-auto px-5 py-6 sm:px-8 sm:py-8 lg:px-10 bg-[#1e1e1e]">
            <div class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
                <div>
                    <p class="text-xs uppercase tracking-widest text-amber-400 mb-2">Tu colección</p>
                    <h1 class="text-3xl font-semibold text-white tracking-wide">Biblioteca</h1>
                    <p class="mt-2 max-w-2xl text-sm text-gray-400">Consulta tus aplicaciones instaladas y mantén todo actualizado.</p>
                </div>
                <div class="library-actions">
                    <button id="check-updates-btn" class="library-button">
                        Buscar actualizaciones
                    </button>
                    <button id="update-all-btn" class="library-button library-button-secondary" hidden>
                        Actualizar todo
                    </button>
                </div>
            </div>
            <section aria-labelledby="actualizaciones-heading">
                <h2 id="actualizaciones-heading" class="text-lg font-semibold text-white mb-4">Actualizaciones y descargas</h2>
                <p id="updates-status" class="updates-status" role="status" aria-live="polite">Buscando actualizaciones...</p>
                <div class="update-list" id="app-list"></div>
            </section>
        </main>
    </div>
    <script src="biblioteca.js"></script>
</body>
</html>
